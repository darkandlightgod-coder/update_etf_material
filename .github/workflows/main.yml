name: Run All Scrapers

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # 並行任務定義
  scrape-tasks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script: [0050.py, 006208.py]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread oauth2client
          playwright install chromium

      - name: Run Scraper
        env:
          GSPREAD_JSON: ${{ secrets.GSPREAD_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python ${{ matrix.script }}

  # 避免 60 天排程失效的 Keepalive 任務（使用原生 Git 空提交）
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    needs: scrape-tasks # 確保在爬蟲任務完成後才執行
    if: always()        # 無論前面爬蟲成功或失敗，都強制執行保活
    permissions:
      contents: write   # 賦予寫入權限以推送空 Commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keepalive Empty Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push
